title: Script Interpreter or Proxy Binary Spawned by WMI Provider Host
id: 6d951fd7-0d09-4369-b4a3-87b5304f13a9
status: experimental
author: Igor Moura (DEATHCon 2026, Living Off the Script)
date: 2026-11-08
references:
  - https://mouralgor.github.io/deathcon2026-living-off-the-script/
description: Detects processes commonly abused for execution started through WMI, a common way to break parent-child lineage from Office macros.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: '\WmiPrvSE.exe'
    Image|endswith:
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: selection
falsepositives:
  - Management tooling that runs commands over WMI (SCCM, some RMM agents). Baseline by CommandLine and User, then exclude.
level: high
tags:
  - attack.execution
  - attack.t1047
  - attack.t1218.005
