title: PowerShell Encoded Command (Prefix and Dash Variants)
id: 056c5ea3-103a-4388-8275-55f71c074659
status: experimental
author: Igor Moura (DEATHCon 2026, Living Off the Script)
date: 2026-11-08
references:
  - https://mouralgor.github.io/deathcon2026-living-off-the-script/
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_flag:
    CommandLine|windash|contains:
      - ' -e '
      - ' -ec '
      - ' -en '
      - ' -enc '
      - ' -enco'
  condition: all of selection_*
falsepositives:
  - Some management agents and installers use encoded commands. Baseline by ParentImage.
level: medium
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
